plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// AFK Guard's policy checks are a plain main(); a failure fails the build.
tasks.register('guardTest', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'xnmc.afkguard.GuardTest'
	jvmArgs '-ea'
}
check.dependsOn guardTest
// No JUnit here; guardTest is the suite.
test.enabled = false

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
